---
layout: default
---

<article class="post">
  <p class="post-back"><a href="{{ '/notes/' | relative_url }}"><span aria-hidden="true">&larr;</span> all notes</a></p>

  <h1 class="post-title">{{ page.title }}</h1>

  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>
    {%- if page.tags and page.tags.size > 0 %}
      <span class="colophon-sep" aria-hidden="true">·</span>
      {% for tag in page.tags %}<span class="tag tag--inline" data-tag="{{ tag }}"><span class="tag-hash" aria-hidden="true">#</span>{{ tag }}</span>{% endfor %}
    {%- endif %}
  </p>

  <div class="prose">
    {{ content }}
  </div>
</article>
