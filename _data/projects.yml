- title: "Al-Mirath"
  summary: "A narrative life simulator set across four eras of Islamic history — Umayyad, Abbasid, Mamluk, and Ottoman."
  year: "ongoing"
  tags: [coursework, java]
  details: >
    You are born into a randomly generated station in life and carry a single character from childhood to their final chronicle. Every decision moves eight personal stats and eight faction standings, sets story flags that later events read back, and steers you toward one of many endings.
    Built with JavaFX 21 and an embedded SQLite database.
  links:
    - label: "repo"
      url: "https://github.com/snipingTurtle/Al-Mirath"          # [FILL IN]
  learned: "How to structure a large project with multiple classes and packages, how to use JavaFX for UI design, 
    and how to integrate a database into a Java application."


- title: "JavaFX Wordle"
  summary: "A Wordle clone in JavaFX with an FXML-based UI and a working game-state controller."
  year: "2026"
  tags: [coursework, java]
  details: >
    Academic assignment built to strict structural conformity with a base
    Eclipse project template — the constraint was as much the exercise as
    the game itself.
  links:
    - label: "repo"
      url: ""          # [FILL IN]
  learned: "Separating game state from the view. Once the controller stopped knowing about colors, the logic got much easier to test."

