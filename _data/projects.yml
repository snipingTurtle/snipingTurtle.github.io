- title: "Hall Management System"
  summary: "A C++ based Hall Management System designed for efficient handling of student complaints and official notice board announcements."
  year: "2025"
  tags: [coursework, cpp]
  details: >
    A C++ based Hall Management System designed for efficient handling of
    student complaints and official notice board announcements. The system
    allows students to submit complaints, which are then reviewed by the
    hall authorities. Additionally, the system provides a platform for
    posting official notices and announcements for the students.
  links:
    - label: "repo"
      url: "https://github.com/snipingTurtle/Disaster-Oriented-Programming"          # [FILL IN]
  learned: "Understanding the importance of data structures and algorithms in building efficient systems. Learned to implement a complaint management system with proper data handling."

