- title: "JavaFX Wordle"
  summary: "A Wordle clone in JavaFX with an FXML-based UI and a working game-state controller."
  year: "2025"
  tags: [coursework, java]
  details: >
    Academic assignment built to strict structural conformity with a base
    Eclipse project template — the constraint was as much the exercise as
    the game itself.
  links:
    - label: "repo"
      url: ""          # [FILL IN]
  learned: "Separating game state from the view. Once the controller stopped knowing about colors, the logic got much easier to test."

